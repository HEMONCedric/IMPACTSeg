# IMPACT-Seg 3D training recipe (128^3 patches), same recipe as the 2.5D network.
# Reads images standardized and resampled by tools/preprocess_training_dataset.py (.nii).
# Keep spacing [1.5, 1.5, 2.0] mm; no second preprocessing/resampling.
# The launcher selects the fold and substitutes the authoritative class count.
Trainer:
  train_name: IMPACTSeg_multimodal_resencm_3D128_B1_sgd_poly
  manual_seed: 42
  epochs: 200
  autocast: true
  it_lr_update: 1
  it_validation: 100000
  ema_decay: 0.0
  save_checkpoint_mode: BEST
  data_log: [image/IMAGE/3, mask_fine/IMAGE/3, Argmax/IMAGE/3]
  EarlyStopping: None
  gradient_checkpoints: None
  gpu_checkpoints: None

  Model:
    classpath: impactseg.models:ImpactSegResidualEncoderUNet
    ImpactSegResidualEncoderUNet:
      dim: 3
      in_channels: 1
      num_classes: ${IMPACTSEG_FINE_NETWORK_OUTPUTS}
      n_stages: 6
      features_per_stage: [32, 64, 128, 256, 320, 512]
      strides: [1, 2, 2, 2, 2, 2]
      kernel_sizes: 3
      n_blocks_per_stage: [1, 3, 4, 6, 6, 6]
      n_conv_per_stage_decoder: [1, 1, 1, 1, 1]
      conv_bias: true
      negative_slope: 0.01
      # Small volumetric batches: normalize per volume, with learned affine.
      norm_mode: INSTANCE_AFFINE
      deep_supervision_outputs: 3
      optimizer:
        name: SGD
        lr: 1.0e-02
        momentum: 0.99
        dampening: 0.0
        weight_decay: 3.0e-05
        nesterov: true
        maximize: false
      schedulers:
        PolyLRScheduler:
          initial_lr: 1.0e-02
          max_steps: 2000000
          exponent: 0.9
          current_step: null
          nb_step: 0
      outputs_criterions:
        Logits_4:
          targets_criterions:
            mask_fine:
              criterions_loader:
                impactseg_losses:SegCrossEntropy:
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  schedulers:
                    Constant: {nb_step: 0}
                  background_weight: 0.2
                  label_smoothing: 0.02
        Softmax_4:
          targets_criterions:
            mask_fine:
              criterions_loader:
                impactseg_losses:DiceNoBackground:
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  schedulers:
                    Constant: {nb_step: 0}
                  smooth: 1.0e-06
                  only_present: true
                impactseg_losses:DiceNoBackgroundAbsentAware:
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  schedulers:
                    Constant: {nb_step: 0}
                  smooth: 1.0e-06
                  coefficient: 0.20
                impactseg_losses:DiceNoBackgroundMetric:
                  is_loss: false
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  schedulers:
                    Constant: {nb_step: 0}
                  smooth: 1.0e-06
                  only_present: true
        Softmax_3:
          targets_criterions:
            mask_fine:
              criterions_loader:
                impactseg_losses:DiceNoBackground:
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  schedulers:
                    Constant: {nb_step: 0}
                  smooth: 1.0e-06
                  only_present: true
                  coefficient: 0.20
        Softmax_2:
          targets_criterions:
            mask_fine:
              criterions_loader:
                impactseg_losses:DiceNoBackground:
                  is_loss: true
                  group: 0
                  start: 0
                  stop: None
                  accumulation: false
                  schedulers:
                    Constant: {nb_step: 0}
                  smooth: 1.0e-06
                  only_present: true
                  coefficient: 0.10

  Dataset:
    dataset_filenames:
      - ${IMPACTSEG_DATASET_ROOT}/CT:a:nii
      - ${IMPACTSEG_DATASET_ROOT}/CBCT:a:nii
      - ${IMPACTSEG_DATASET_ROOT}/MRI:a:nii
      - ${IMPACTSEG_DATASET_ROOT}/SynthRADSegMRI:a:nii
      - ${IMPACTSEG_DATASET_ROOT}/SynthRADSegCBCT:a:nii
    groups_src:
      image:
        groups_dest:
          image:
            is_input: true
            transforms:
              TensorCast: {dtype: float32, inverse: false}
            patch_transforms: None
      mask_fine:
        groups_dest:
          mask_fine:
            is_input: false
            transforms:
              TensorCast: {dtype: uint8, inverse: false}
            patch_transforms: None
    augmentations:
      DataAugmentation_0:
        nb: 1
        data_augmentations:
          Brightness:
            prob: 0.15
            b_std: 0.10
            groups: [image]
          # Keep acquisition degradation in-plane (existing anisotropic data).
          impactseg.augmentations:SimulateLowResolution:
            prob: 0.15
            factor_min: 1.0
            factor_max: 2.0
            groups: [image]
          impactseg.augmentations:GaussianNoise:
            prob: 0.15
            std_min: 0.0
            std_max: 0.04
            groups: [image]
          impactseg.augmentations:GaussianBlur:
            prob: 0.15
            sigma_min: 0.5
            sigma_max: 0.8
            # Now blur along all three spatial axes; uses the existing halo.
            in_plane_only: false
            groups: [image]
          Contrast:
            prob: 0.15
            c_std: 0.17
            groups: [image]
    inline_augmentations: true
    validation_augmentations: false
    subset: ${IMPACTSEG_SPLITS_ROOT}/fold1/train.txt
    validation: ${IMPACTSEG_SPLITS_ROOT}/fold1/validation.txt
    shuffle: true
    foreground_sampling:
      enabled: true
      foreground_probability: 0.70
      mask_group: mask_fine
    banked_streaming:
      enabled: false
    batch_size: 1
    memory_budget: 96 GiB
    num_workers: 8
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: true
    Patch:
      patch_size: [128, 128, 128]
      overlap: None
      # float32 images use -2; uint8 label maps are padded with 0 by KonfAI.
      pad_value: -2
      extend_slice: 0
